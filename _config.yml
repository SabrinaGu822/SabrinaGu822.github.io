title: "深海的呼唤计划"
description: "记录生活、旅行、照片与思考"
author: "深海的呼唤计划"
url: "https://sabrinagu822.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai
markdown: kramdown
permalink: /archives/:title/
paginate: 8
paginate_path: "/page/:num/"
plugins:
  - jekyll-feed
  - jekyll-seo-tag
header_pages:
  - about.md
  - diary.md
  - travel.md
  - photos.md
  - notes.md
  - reading.md
  - fragments.md

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
